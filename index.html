        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
